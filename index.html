<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0c12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Onde Live">
<title>Onde Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0}body{-webkit-text-size-adjust:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0a0a0f}
:root{
  --bg:#0a0a0f; --ink:#ffffff; --muted:#c7c9d1;
  --pink:#fe2c55; --cyan:#25f4ee; --violet:#7b61ff; --gold:#ffd54a;
  --accent:#fe2c55; --live:#fe2c55;
  --glass:rgba(22,22,30,.46); --glassStrong:rgba(16,16,24,.82); --line:rgba(255,255,255,.16);
  --display:"Unbounded",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
.app{position:relative;height:100vh;height:100dvh;max-width:520px;margin:0 auto;overflow:hidden;background:#000}
canvas#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#cam,#camImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:100%}
#cam.mirror{transform:scaleX(-1)}
#camImg{animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08) translate(-1%,1%)}}
.camcard{position:absolute;left:18px;right:18px;top:50%;transform:translateY(-50%);z-index:8;display:grid;gap:12px;text-align:center;
  background:var(--glassStrong);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid var(--line);border-radius:24px;padding:26px 22px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.camcard b{font-family:var(--display);font-weight:800;font-size:19px;text-wrap:balance;
  background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.camcard span{color:var(--muted);font-size:13.5px;line-height:1.5}
.camcard button{border:0;border-radius:14px;padding:14px;font:800 15px var(--body);cursor:pointer;color:#fff;
  background:linear-gradient(90deg,var(--pink),#ff5c7a);box-shadow:0 8px 24px rgba(254,44,85,.4)}
.camcard button.ghost{background:rgba(255,255,255,.08);color:var(--ink);font-weight:600;box-shadow:none}
.camtitle{width:100%;border:1px solid var(--line);background:#0f0e15;color:var(--ink);border-radius:12px;padding:12px 14px;font:600 15px var(--body);text-align:center;outline:none}
.camtitle:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(254,44,85,.2)}
.camtitle::placeholder{color:var(--muted);font-weight:500}
.camcard[hidden]{display:none}
.shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 20%,transparent 50%,rgba(0,0,0,.8) 100%)}
.top{position:absolute;left:0;right:0;top:0;padding:12px 14px;display:flex;align-items:center;gap:8px;z-index:3}
.host{display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:4px;border-radius:999px;min-width:0;border:1px solid rgba(255,255,255,.08)}
.ava{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:13px;font-weight:800;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);
  background:var(--pink);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.host .who{min-width:0;line-height:1.2}
.host b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.host small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.follow{border:0;background:var(--pink);color:#fff;font:800 12px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer;flex:none;box-shadow:0 4px 14px rgba(254,44,85,.45)}
.follow.on{background:rgba(255,255,255,.14);color:var(--ink);box-shadow:none}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:7px 11px;border-radius:999px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid rgba(255,255,255,.08)}
.live-tag{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,var(--pink),#ff5c7a);color:#fff;
  font-family:var(--display);font-weight:800;font-size:10px;letter-spacing:.1em;padding:7px 10px;border-radius:8px;box-shadow:0 4px 14px rgba(254,44,85,.5)}
.live-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.eye{width:14px;height:14px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.iconbtn:focus-visible,.follow:focus-visible,.send:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.titlebar{position:absolute;top:62px;left:16px;right:16px;z-index:3;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.titlebar h1{margin:0;font-family:var(--display);font-weight:600;font-size:14px;line-height:1.3;text-wrap:balance;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.chip{font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.14);font-variant-numeric:tabular-nums}
.gift{position:absolute;left:16px;top:118px;z-index:4;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);
  background:linear-gradient(90deg,var(--pink),var(--violet));color:#fff;border-radius:999px;padding:6px 16px 6px 6px;
  box-shadow:0 10px 30px rgba(123,97,255,.4);transform:translateX(-120%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
.gift.show{transform:none}
.gift .gico{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.gift b{font-size:13px}.gift span{font-size:12px;display:block;opacity:.9}
.chat{position:absolute;left:0;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:76%;max-height:42%;z-index:3;padding:0 12px 0 14px;
  overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 24%);mask-image:linear-gradient(180deg,transparent 0,#000 24%)}
.msg{font-size:13.5px;line-height:1.35;animation:pop .28s ease-out;min-width:0;overflow-wrap:anywhere;align-self:flex-start;
  background:rgba(12,12,18,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border-radius:14px;padding:6px 11px;max-width:100%}
.msg .u{font-weight:700;margin-right:6px;opacity:.95}
.msg.sys{color:var(--muted);font-size:12.5px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;padding:2px 4px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.msg.me{background:linear-gradient(90deg,rgba(254,44,85,.9),rgba(255,92,122,.75));color:#fff}
.msg.hl{background:linear-gradient(90deg,rgba(123,97,255,.92),rgba(37,244,238,.35));color:#fff}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;margin-right:5px;vertical-align:1px;background:var(--violet);color:#fff}
.badge.mod{background:var(--cyan);color:#06201f}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.rail{position:absolute;right:10px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;gap:16px;align-items:center}
.rail button{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);font-size:22px;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .12s ease}
#likeBtn{background:linear-gradient(135deg,rgba(254,44,85,.4),rgba(123,97,255,.3))}
.rail .n{font-size:11px;font-weight:700;margin-top:-12px;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px #000}
.rail button:active{transform:scale(.88)}
.hearts{position:absolute;right:8px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:70px;height:55%;pointer-events:none;z-index:2}
.heart{position:absolute;bottom:0;left:50%;font-size:24px;will-change:transform,opacity;animation:float 2.6s ease-out forwards}
@keyframes float{
  0%{transform:translate(-50%,0) scale(.4);opacity:0}
  10%{opacity:1;transform:translate(-50%,-10px) scale(1)}
  100%{transform:translate(calc(-50% + var(--dx)),-340px) scale(.9);opacity:0}}
.composer{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);
  font:500 15px var(--body);padding:13px 18px;border-radius:999px;outline:none;transition:border-color .2s,box-shadow .2s}
.composer input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(254,44,85,.2)}
.composer input::placeholder{color:var(--muted)}
.send{border:0;background:linear-gradient(135deg,var(--pink),#ff5c7a);color:#fff;width:48px;height:48px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 6px 18px rgba(254,44,85,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:10;background:#131019;border-radius:24px 24px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1.1);border-top:1px solid var(--line);box-shadow:0 -20px 50px rgba(0,0,0,.5)}
.sheet::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:999px;background:rgba(255,255,255,.25)}
.sheet.open{transform:none}
.sheet h2{font-family:var(--display);font-size:16px;font-weight:800;margin:0 0 4px}
.sheet p.sub{margin:0 0 18px;color:var(--muted);font-size:13px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.field label output{color:var(--cyan);font-variant-numeric:tabular-nums}
.field input[type=range]{width:100%;accent-color:var(--pink)}
.field input[type=text]{background:#0f0e15;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:500 14px var(--body);outline:none}
.field input[type=text]:focus{border-color:var(--pink)}
.row{display:flex;gap:10px}
.row button{flex:1;border:1px solid var(--line);background:#0f0e15;color:var(--ink);border-radius:12px;padding:12px;font:600 14px var(--body);cursor:pointer}
.row button.primary{background:linear-gradient(90deg,var(--pink),#ff5c7a);color:#fff;border-color:transparent}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:9;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.msg,.heart{animation-duration:.01s}.gift,.sheet{transition:none}.live-tag::before{animation:none}#camImg{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <canvas id="stage" aria-hidden="true"></canvas>
  <video id="cam" playsinline muted loop autoplay hidden></video>
  <img id="camImg" alt="" hidden>
  <div class="shade"></div>
  <input type="file" id="camFile" accept="video/*,image/*" capture="user" hidden>
  <div class="camcard" id="camcard">
    <b>Passe en direct</b>
    <input type="text" id="camTitle" class="camtitle" maxlength="70" placeholder="Titre de ton live (ex. On papote ensemble !)" aria-label="Titre du live">
    <span>Autorise la caméra quand ton navigateur te le demande. Rien n'est envoyé nulle part, l'image reste sur ton téléphone.</span>
    <button id="camBtn">Allumer ma caméra</button>
    <button class="ghost" id="camPick">Choisir une vidéo ou une photo</button>
    <button class="ghost" id="camSkip">Plus tard</button>
  </div>

  <div class="top">
    <div class="host">
      <div class="ava" id="ava">LC</div>
      <div class="who"><b id="hostName">LeroiCharles</b><small id="likes">0 j'aime</small></div>
      <button class="follow" id="follow">Suivre</button>
    </div>
    <div class="spacer"></div>
    <span class="live-tag">LIVE</span>
    <span class="pill" title="Spectateurs">
      <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="viewers">0</span>
    </span>
    <button class="iconbtn" id="openSettings" aria-label="Réglages du live">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <div class="titlebar">
    <h1 id="liveTitle">Discussion tranquille, venez parler</h1>
    <span class="chip" id="uptime">00:00</span>
  </div>

  <div class="gift" id="gift"><div class="gico" id="giftIco">★</div><div><b id="giftWho"></b><span id="giftWhat"></span></div></div>

  <div class="chat" id="chat" aria-live="polite"></div>
  <div class="hearts" id="hearts"></div>

  <div class="rail">
    <button id="likeBtn" aria-label="Envoyer un cœur">❤️</button><span class="n" id="likeN">0</span>
    <button id="giftBtn" aria-label="Envoyer un cadeau">🎁</button><span class="n">Cadeau</span>
    <button id="shareBtn" aria-label="Partager">↗</button><span class="n" id="shareN">0</span>
  </div>

  <form class="composer" id="composer" autocomplete="off">
    <input id="msgInput" type="text" placeholder="Écris un commentaire…" maxlength="140" aria-label="Commentaire">
    <button class="send" type="submit" aria-label="Envoyer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
    </button>
  </form>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Réglages du live">
    <h2>Réglages du live</h2>
    <p class="sub">Tout est simulé : les spectateurs, le chat et les cadeaux.</p>
    <div class="field">
      <label for="setTitle">Titre du live</label>
      <input type="text" id="setTitle" maxlength="70">
    </div>
    <div class="field">
      <label for="setHost">Pseudo de l'hôte</label>
      <input type="text" id="setHost" maxlength="24">
    </div>
    <div class="field">
      <label for="setViewers">Spectateurs visés <output id="oViewers"></output></label>
      <input type="range" id="setViewers" min="10" max="250000" step="10">
    </div>
    <div class="field">
      <label for="setSpeed">Vitesse du chat <output id="oSpeed"></output></label>
      <input type="range" id="setSpeed" min="1" max="10" step="1">
    </div>
    <div class="row" style="margin-bottom:10px">
      <button id="camFlip">Retourner la caméra</button>
      <button id="camAgain">Changer la source</button>
    </div>
    <div class="row">
      <button id="raid">Lancer un raid</button>
      <button class="primary" id="closeSettings">Fermer</button>
    </div>
  </div>
</div>

<script>

  const replies = ['grave','c\'est clair','+1','pareil','mdr oui','ah ouais ?','tellement'];
  const gifts = [['🌹','une rose'],['🍩','un donut'],['⭐','une étoile'],['👑','une couronne'],['💎','un diamant'],['🚀','une fusée']];

  const chat = $('chat');
  function addMsg({name, text, cls='', badge=''}) {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    if (name) {
      if (badge) { const b = document.createElement('span'); b.className = 'badge' + (badge==='Modo'?' mod':''); b.textContent = badge; d.appendChild(b); }
      const u = document.createElement('span'); u.className = 'u'; u.style.color = colorFor(name); u.textContent = name; d.appendChild(u);
    }
    d.appendChild(document.createTextNode(text));
    chat.appendChild(d);
    while (chat.children.length > 40) chat.firstChild.remove();
  }
  let lastName = null;
  function botMessage() {
    const name = user();
    const r = Math.random();
    let badge = r < .05 ? 'Modo' : r < .15 ? 'Abonné' : '';
    let text = (lastName && Math.random() < .12) ? '@' + lastName + ' ' + pick(replies) : pick(lines);
    addMsg({ name, text, badge });
    lastName = name;
    if (Math.random() < .06) addMsg({ text: name + ' a rejoint le live', cls:'sys' });
  }
  function chatLoop() {
    if (!document.hidden) {
      const burst = Math.random() < .15 ? Math.ceil(rand(2,4)) : 1;
      for (let i=0;i<burst;i++) botMessage();
    }
    const vf = Math.min(1, Math.log10(Math.max(10,state.viewers))/5);
    const base = 2400 / (state.speed * (0.4 + vf));
    setTimeout(chatLoop, rand(base*.4, base*1.4));
  }

  const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1).replace('.',',')+' M' : n >= 1e4 ? (n/1e3).toFixed(1).replace('.',',')+' k' : n.toLocaleString('fr-FR');
  function viewerLoop() {
    const diff = state.target - state.viewers;
    state.viewers += Math.round(diff * rand(.05,.18) + rand(-1,1) * state.target * .008);
    state.viewers = Math.max(1, state.viewers);
    $('viewers').textContent = fmt(state.viewers);
    setTimeout(viewerLoop, rand(700,1600));
  }

  const heartsEl = $('hearts');
  const heartGlyphs = ['❤️','🧡','💛','💜','🩷','🤍'];
  function heart(glyph) {
    if (reduce || heartsEl.childElementCount > 60) return;
    const h = document.createElement('span');
    h.className = 'heart'; h.textContent = glyph || pick(heartGlyphs);
    h.style.setProperty('--dx', rand(-50,30)+'px');
    h.style.fontSize = rand(18,30)+'px';
    heartsEl.appendChild(h);
    h.addEventListener('animationend', () => h.remove());
  }
  function addLikes(n){ state.likes += n; $('likes').textContent = fmt(state.likes)+' j\'aime'; $('likeN').textContent = fmt(state.likes); }
  function likeLoop() {
    const rate = Math.min(8, 2 + state.viewers/2000);
    const n = Math.random() < .85 ? Math.ceil(rand(1,rate)) : 0;
    for (let i=0;i<n;i++) setTimeout(()=>heart(), i*120);
    addLikes(n * Math.ceil(rand(1, 1 + state.viewers/400)));
    setTimeout(likeLoop, rand(350,800));
  }
  $('likeBtn').addEventListener('click', () => { heart('❤️'); addLikes(1); });
  ['stage','cam','camImg'].forEach(id => $(id).addEventListener('click', () => { for(let i=0;i<3;i++) setTimeout(()=>heart('❤️'), i*90); addLikes(3); }));

  const giftEl = $('gift'); let giftTimer;
  function showGift(name, g, count) {
    $('giftIco').textContent = g[0];
    $('giftWho').textContent = name;
    $('giftWhat').textContent = 'a envoyé ' + g[1] + (count>1 ? ' ×' + count : '');
    giftEl.classList.add('show');
    clearTimeout(giftTimer); giftTimer = setTimeout(() => giftEl.classList.remove('show'), 3200);
    addMsg({ name, text: 'a envoyé ' + g[1] + ' ' + g[0], cls:'hl' });
    for (let i=0;i<5;i++) setTimeout(()=>heart(g[0]), i*150);
  }
  function giftLoop() {
    if (!document.hidden) showGift(user(), pick(gifts), Math.random()<.3 ? Math.ceil(rand(2,20)) : 1);
    setTimeout(giftLoop, rand(9000, 22000) / Math.max(.5, state.speed/5));
  }
  $('giftBtn').addEventListener('click', () => showGift('toi', pick(gifts), 1));

  $('shareBtn').addEventListener('click', () => { state.shares++; $('shareN').textContent = state.shares; addMsg({text:'Tu as partagé le live', cls:'sys'}); });
  setInterval(() => { if (Math.random()<.3){ state.shares += 1; $('shareN').textContent = fmt(state.shares);} }, 4000);
  $('follow').addEventListener('click', e => {
    state.following = !state.following;
    e.currentTarget.classList.toggle('on', state.following);
    e.currentTarget.textContent = state.following ? 'Abonné' : 'Suivre';
    if (state.following) addMsg({text:'Tu suis maintenant ' + $('hostName').textContent, cls:'sys'});
  });

  const hostReplies = ['merci 🙏','ahah oui !','bonne question, je réponds juste après','bienvenue à toi !','yes exactement','trop gentil merci','mdr non','on en parle tout de suite'];
  $('composer').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('msgInput').value.trim(); if (!v) return;
    addMsg({ name:'toi', text:v, cls:'me' });
    $('msgInput').value = '';
    setTimeout(() => addMsg({ name: user(), text: '@toi ' + pick(replies) }), rand(800, 2500));
    if (Math.random() < .5) setTimeout(() => addMsg({ name: $('hostName').textContent, text: '@toi ' + pick(hostReplies), badge:'Hôte' }), rand(2500, 5000));
  });

  setInterval(() => {
    const s = Math.floor((Date.now()-state.start)/1000);
    const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
    $('uptime').textContent = (h? h+':' : '') + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }, 1000);

  const sheet = $('sheet'), scrim = $('scrim');
  const open = v => { sheet.classList.toggle('open', v); scrim.classList.toggle('open', v); };
  $('openSettings').addEventListener('click', () => open(true));
  $('closeSettings').addEventListener('click', () => open(false));
  scrim.addEventListener('click', () => open(false));
  $('setTitle').value = $('liveTitle').textContent;
  $('setHost').value = $('hostName').textContent;
  $('setViewers').value = state.target; $('oViewers').textContent = fmt(state.target);
  $('setSpeed').value = state.speed; $('oSpeed').textContent = state.speed + '/10';
  $('setTitle').addEventListener('input', e => $('liveTitle').textContent = e.target.value || 'Live');
  $('camTitle').addEventListener('input', e => {
    const v = e.target.value.trim();
    $('liveTitle').textContent = v || 'Mon live en direct';
    $('setTitle').value = e.target.value;
  });
  $('setHost').addEventListener('input', e => {
    const v = e.target.value || 'hote';
    $('hostName').textContent = v;
    $('ava').textContent = v.replace(/[^a-zA-Z]/g,'').slice(0,2).toUpperCase() || '?';
  });
  $('setViewers').addEventListener('input', e => { state.target = +e.target.value; $('oViewers').textContent = fmt(state.target); });
  $('setSpeed').addEventListener('input', e => { state.speed = +e.target.value; $('oSpeed').textContent = state.speed + '/10'; });
  $('raid').addEventListener('click', () => {
    const n = Math.round(state.target * rand(.3,.8)) + 200;
    const from = user();
    addMsg({ text: '⚡ Raid de ' + from + ' avec ' + fmt(n) + ' spectateurs !', cls:'hl' });
    state.viewers += n; state.target += Math.round(n*.6);
    $('setViewers').value = Math.min(250000, state.target); $('oViewers').textContent = fmt(state.target);
    const prev = state.speed; state.speed = 10; setTimeout(()=> state.speed = prev, 6000);
    for (let i=0;i<14;i++) setTimeout(()=>heart(), i*80);
    open(false);
  });

  const cv = $('stage'), ctx = cv.getContext('2d');
  let W, H, dpr;
  function resize(){ dpr = Math.min(2, devicePixelRatio||1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener('resize', resize); resize();
  const bokeh = Array.from({length:22}, () => ({ x:Math.random(), y:Math.random()*.6, r:rand(8,40), h:pick([38,30,200,330,45]), a:rand(.08,.25), p:Math.random()*6.28 }));
  function frame(t){
    const s = t/1000;
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1d1830'); g.addColorStop(1,'#0d0c12');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    for (const b of bokeh){ const a = b.a*(.7+.3*Math.sin(s*.8+b.p)); ctx.fillStyle=`hsla(${b.h},90%,70%,${a})`; ctx.beginPath(); ctx.arc(b.x*W + Math.sin(s*.2+b.p)*6, b.y*H + H*.15, b.r, 0, 6.283); ctx.fill(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const cam = $('cam'), camImg = $('camImg'), camcard = $('camcard'), camFile = $('camFile');
  let objUrl = null, stream = null, facing = 'user';
  function clearMedia(){
    if (stream) { stream.getTracks().forEach(t=>t.stop()); stream = null; }
    if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; }
    cam.hidden = true; camImg.hidden = true; cam.removeAttribute('src'); cam.srcObject = null;
  }
  function goLive(){
    camcard.hidden = true;
    addMsg({ text:'Le live a commencé 🔴', cls:'sys' });
    setTimeout(()=>addMsg({ name:user(), text:'ohhh on te voit enfin 😍' }), 900);
    setTimeout(()=>addMsg({ name:user(), text:'t\'es trop frais aujourd\'hui' }), 2200);
  }
  async function tryCamera(){
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw 0;
      const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing, width:{ideal:1280}, height:{ideal:720} }, audio:false });
      clearMedia(); stream = s;
      cam.srcObject = s; cam.classList.toggle('mirror', facing==='user'); cam.hidden = false; await cam.play().catch(()=>{});
      if (!camcard.hidden) goLive();
    } catch (e) {
      if (camcard.hidden) return;
      addMsg({ text:'Caméra refusée ou indisponible. Tu peux choisir une vidéo à la place.', cls:'sys' });
      camFile.setAttribute('capture','user');
      camFile.click();
    }
  }
  camFile.addEventListener('change', () => {
    const f = camFile.files && camFile.files[0]; if (!f) return;
    clearMedia(); objUrl = URL.createObjectURL(f);
    if (f.type.startsWith('image/')) { camImg.src = objUrl; camImg.hidden = false; }
    else { cam.classList.remove('mirror'); cam.src = objUrl; cam.hidden = false; cam.play().catch(()=>{}); }
    camFile.value = '';
    goLive();
  });
  async function flipCam(){ if(!stream){ open(false); return; } facing = facing==='user' ? 'environment' : 'user'; open(false); await tryCamera(); }
  $('camBtn').addEventListener('click', tryCamera);
  $('camPick').addEventListener('click', () => { camFile.removeAttribute('capture'); camFile.click(); });
  $('camSkip').addEventListener('click', () => { camcard.hidden = true; });
  $('camFlip').addEventListener('click', flipCam);
  $('camAgain').addEventListener('click', () => { open(false); camcard.hidden = false; });

  addMsg({ text:'Bienvenue sur le live ! Reste respectueux dans le chat.', cls:'sys' });
  for (let i=0;i<6;i++) botMessage();
  state.viewers = Math.round(state.target*rand(.85,.95));
  viewerLoop(); chatLoop(); likeLoop(); setTimeout(giftLoop, 4000);
})();
